<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conversor de unidades de medida moderno, intuitivo y preciso en tiempo real. Soporta longitud, masa, temperatura, tiempo, volumen, velocidad, área y datos.">
  <title>Conversor de Unidades Multicategoría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-decorations" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="m16 16 3-8 3 8"/><path d="M4 16 7 8l3 8"/><path d="M6 14h3"/><path d="M18 14h3"/><path d="M12 3v18"/></svg>
      </div>
      <h1>Conversor de Unidades</h1>
      <p class="subtitle">Conversiones precisas e instantáneas en tiempo real</p>
    </header>

    <main class="converter-card">
      <!-- Selección de Categoría -->
      <section class="category-section" aria-label="Selección de categoría">
        <label for="category-select" class="section-label">Categoría de Medida</label>
        <div class="category-grid" id="category-grid" role="radiogroup" aria-label="Categorías disponibles">
          <!-- Se llenará dinámicamente mediante JS para accesibilidad y extensibilidad -->
        </div>
        <select id="category-select" class="sr-only" aria-label="Seleccionar categoría de conversión">
          <!-- Respaldo para accesibilidad nativa -->
        </select>
      </section>

      <!-- Panel de Conversión Principal -->
      <section class="conversion-panel" aria-label="Calculadora de conversión">
        <div class="input-group">
          <label for="from-value" class="input-label">De</label>
          <div class="input-wrapper">
            <input 
              type="number" 
              id="from-value" 
              class="unit-input" 
              placeholder="0" 
              value="1" 
              step="any"
              aria-label="Valor de origen a convertir"
            >
          </div>
          <select id="from-unit" class="unit-select" aria-label="Unidad de origen">
            <!-- Opciones cargadas dinámicamente -->
          </select>
        </div>

        <div class="swap-action">
          <button type="button" id="swap-btn" class="swap-button" title="Intercambiar unidades" aria-label="Intercambiar unidad de origen y destino">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4"/><path d="M3 8l4-4 4 4"/><path d="M17 8v12"/><path d="M13 16l4 4 4-4"/></svg>
          </button>
        </div>

        <div class="input-group result-group">
          <label for="to-value" class="input-label">A (Resultado)</label>
          <div class="input-wrapper result-wrapper">
            <input 
              type="text" 
              id="to-value" 
              class="unit-input result-input" 
              readonly 
              value="0" 
              aria-label="Resultado de la conversión" 
              aria-live="polite"
            >
            <button type="button" id="copy-btn" class="copy-button" title="Copiar resultado" aria-label="Copiar resultado al portapapeles">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="copy-icon"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              <span id="copy-tooltip" class="tooltip">¡Copiado!</span>
            </button>
          </div>
          <select id="to-unit" class="unit-select" aria-label="Unidad de destino">
            <!-- Opciones cargadas dinámicamente -->
          </select>
        </div>
      </section>

      <!-- Info de Fórmula / Explicación -->
      <div class="formula-card" id="formula-card">
        <div class="formula-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </div>
        <div class="formula-content">
          <span class="formula-title">Fórmula de conversión</span>
          <p id="formula-text" class="formula-text">1 metro = 100 centímetros</p>
        </div>
      </div>

      <!-- Historial de Conversiones Recientes -->
      <section class="history-section" aria-label="Historial de conversiones recientes">
        <div class="history-header">
          <h2>Conversiones Recientes</h2>
          <button type="button" id="clear-history-btn" class="text-button" aria-label="Borrar historial de conversiones">Limpiar</button>
        </div>
        <ul id="history-list" class="history-list">
          <li class="history-empty">No hay conversiones recientes</li>
        </ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>Conversor de Unidades &copy; 2026 &bull; Desarrollado con HTML5, CSS3 y Vanilla JavaScript</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
